function add(k,d){k=String(k);bag[k]=(bag[k]||0)+d;if(bag[k]<=0)delete bag[k];renderBag();var b=$('bagCount');b.classList.remove('bump');void b.offsetWidth;b.classList.add('bump');}
function grid(){var h='';D.items.forEach(function(it,i){if(cur!=='All'&&it.tab!==cur)return;
 h+='<article class="card glass" data-i="'+i+'" tabindex="0" role="button" aria-label="Inspect '+esc(it.name)+'"><div class="im">'+im(i,it.name)+'</div><div class="bd"><h3>'+esc(it.name)+'</h3><p class="ds">'+esc(it.description)+'</p><div class="ft"><span class="price">'+esc(money(it.price))+'</span><button class="add" data-add="'+i+'" aria-label="Add '+esc(it.name)+' to bag">+</button></div></div></article>';});
 $('grid').innerHTML=h;}
function tabs(){var all=['All'].concat(D.tabs),h='';all.forEach(function(t){h+='<button class="tab" role="tab" aria-selected="'+(t===cur)+'" data-t="'+esc(t)+'">'+esc(t)+'</button>';});$('tabs').innerHTML=h;}
function show(id){$('scrim').classList.add('on');$(id).classList.add('on');}
function hide(){['modal','drawer'].forEach(function(i){$(i).classList.remove('on');});$('scrim').classList.remove('on');if(last&&last.focus)last.focus();}
function inspect(i){var it=D.items[i];last=document.activeElement;$('mImg').innerHTML=im(i,it.name);$('mTitle').textContent=it.name;$('mPrice').textContent=money(it.price);$('mDesc').textContent=it.description;
 $('mAdd').onclick=function(){add(i,1);toast('Added to your bag');};$('mWa').href=wa('Hello '+D.name+', I would like to order: '+it.name+(it.price>0?' ('+money(it.price)+')':''));show('modal');$('mClose').focus();}
function init(){document.title=document.title;$('brand').textContent=D.name;$('hl').textContent=D.headline;$('tg').textContent=D.tagline;$('abp').textContent=D.about;$('abt').textContent='About '+D.name;
 $('heroMedia').innerHTML=im(0,D.name);$('waMain').href=wa('Hello '+D.name+', I found your storefront and would like to know more.');
 var r='<div class="row glass"><span>WhatsApp</span><a href="https://wa.me/'+D.phone+'" target="_blank" rel="noopener"><b>+'+esc(D.phone)+'</b></a></div>';
 if(D.email)r+='<div class="row glass"><span>Email</span><a href="mailto:'+esc(D.email)+'"><b>'+esc(D.email)+'</b></a></div>';
 if(D.address)r+='<div class="row glass"><span>Address</span><b>'+esc(D.address)+'</b></div>';$('rows').innerHTML=r;
 $('foot').textContent='\u00a9 '+new Date().getFullYear()+' '+D.name+(D.city?' \u00b7 '+D.city:'');
 tabs();grid();renderBag();
 $('tabs').addEventListener('click',function(e){var b=e.target.closest('.tab');if(!b)return;cur=b.getAttribute('data-t');tabs();grid();});
 $('grid').addEventListener('click',function(e){var a=e.target.closest('[data-add]');if(a){e.stopPropagation();add(a.getAttribute('data-add'),1);toast('Added to your bag');return;}var c=e.target.closest('.card');if(c)inspect(+c.getAttribute('data-i'));});
 $('grid').addEventListener('keydown',function(e){if((e.key==='Enter'||e.key===' ')&&e.target.classList.contains('card')){e.preventDefault();inspect(+e.target.getAttribute('data-i'));}});
 $('lines').addEventListener('click',function(e){var b=e.target.closest('[data-k]');if(b)add(b.getAttribute('data-k'),+b.getAttribute('data-d'));});
 $('bagBtn').onclick=function(){last=$('bagBtn');show('drawer');};$('dClose').onclick=hide;$('mClose').onclick=hide;$('scrim').onclick=hide;
 document.addEventListener('keydown',function(e){if(e.key==='Escape')hide();});
 $('checkout').onclick=function(){var L=['Hello '+D.name+', I would like to order:',''],t=0,priced=true;
  Object.keys(bag).forEach(function(k){var it=D.items[k],q=bag[k];L.push('- '+q+' x '+it.name+(it.price>0?' ('+money(it.price*q)+')':' (price on request)'));t+=it.price*q;if(!(it.price>0))priced=false;});
  if(t>0)L.push('','Total: '+D.currency+' '+t.toLocaleString('en-US')+(priced?'':' + items on request'));
  window.open(wa(L.join('\n')),'_blank','noopener');};}
init();
</script></body></html>
